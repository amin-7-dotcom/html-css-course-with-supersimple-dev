<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
</head>
<body>
    <div style="display: grid;
    grid-template-columns: 100px 100px;
    ">
        <div style="background-color: skyblue;">div1</div>
        <div style="background-color: lightpink;">div2</div>
    </div>
    <hr>
    <h1>this is now exercise</h1>
    <div style="display: grid;
    grid-template-columns: 200px 75px;">
    <div style="background-color: aqua;">one</div>
    <div style="background-color: aquamarine;">two</div>
    </div>

    <hr><hr><hr>
    <div style="display: grid;
    grid-template-columns: 50px 1fr 75px;">
        <div style="background-color: blanchedalmond;">one</div>
        <div style="background-color: cornsilk;">two</div>
        <div style="background-color: rgb(197, 197, 240);">three</div>
    </div>
    <hr><hr><hr>
    <br><br><br>
    <div style="display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    column-gap: 20px;
    row-gap: 10px;
    ">
        <div style="background-color: greenyellow;">one</div>
        <div style="background-color: aqua;">two</div>
        <div style="background-color: greenyellow;">one</div>
        <div style="background-color: aqua;">two</div>
        <div style="background-color: greenyellow;">one</div>
        <div style="background-color: aqua;">two</div>
        <div style="background-color: greenyellow;">one</div>
        <div style="background-color: aqua;">two</div>
    </div>
</body>
</html>
