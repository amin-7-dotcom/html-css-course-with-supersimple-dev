<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text box</title>
    <style>
        .text1{
            width: 200px;
            font-size:18px;
            padding: 15px;
            border-radius:10px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }
        .text2{
            width: 400px;
            font-size:16px;
            padding: 15px;
            border-radius:28px;
            border:none;
            box-shadow:0px 0px 10px 2px rgba(0,0,0,0.2);
            
        }
    </style>
</head>
<body>
    <!-- this is exercise 1-->
    <input class="text1" type="text" placeholder="Search"><br>
    <!-- this is exercise 2-->
     <input class="text2" type="text" placeholder="Search Google or type a URL">
</body>
</html>
