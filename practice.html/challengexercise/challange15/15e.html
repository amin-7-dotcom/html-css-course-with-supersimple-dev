<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product </title>
    <style>
        body{
            height: 3000px;
        }
        .main{
            position: relative;
            display: inline-block;
        }
        .shirt{
            width: 300px;
            height: 300px;
            object-fit: cover;
        }
        .promotion{
            position: absolute;
            background-color: black;
            color: white;
            top: 10px;
            right: 0;
            font-family: Arial;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="main">
        <img class="shirt" src="/practice.html/images/t shirt.jfif" alt="shirt">
        <div class="promotion">20% OFF</div>
    </div>
</body>
</html>
