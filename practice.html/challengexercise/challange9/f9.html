<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>add friend profile</title>
    <style>
        .profile{
            width: 200px;
            box-shadow: 0px 0px 5px rgba(0,0,0,0.7);
            display: inline-block;
            vertical-align: baseline;
            margin-right: 5px;
            object-fit: cover;
            object-position: center;
        }
        .profile img{
            width: 100%;
            height: auto;
            margin-bottom: 5px;
        }
        h2{
            padding-left: 10px;
            font-family: Arial;
            margin-top: 0;
            margin-bottom: 5px;
        }
        p{
            padding-left: 10px;
            font-family: Arial;
            font-size: 14px;
            color: rgb(106, 102, 102);
            margin-top: 0;
            margin-bottom: 8px;
        }
        .btn{
            margin-left: 10px;
            margin-bottom: 10px;
            padding: 5px 10px;
            background-color: rgb(45, 134, 228);
            font-size: 16px;
            border: none;
            color: #fff;
            font-family: Arial;
            cursor: pointer;
            border-radius: 5px;
        }
        
    </style>
</head>
<body>
    <div class="profile">
    <img class="picture" src="/practice.html/images/cat.jpg" alt="">
    <h2>Oliver</h2>
    <p>2 mutual friends</p>
    <button class="btn">Add Friend</button>
    </div>
