<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lesson2 buttonspractice</title>
    <style>
        .sub{
            background-color: rgb(198, 3, 3);
            text-transform: uppercase;
            border: none;
            padding: 4px;
            color: #f4e5e5;
            border-radius: 3px;
            cursor: pointer;
        }
        .join{
            color: rgb(127, 202, 232);
            border: 2px solid rgb(84, 199, 244);
            padding: 4px 6px 4px 6px;
            text-transform: uppercase;
            background-color: #fff;
            border-radius: 3px;
            cursor: pointer;
        }
        .tweet{
            text-transform: capitalize;
            background-color: rgb(75, 193, 240);
            border: none;
            padding: 6px 10px;
            color: #fff;
            border-radius: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button class="sub">subscribe</button>
    <button class="join">join</button>
    <button class="tweet">tweet</button>
</body>
</html>
