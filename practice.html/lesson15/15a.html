<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>use of absolute</title>
    <style>
        body{
            height: 3000px;
        }
        .close{
            font-family: Arial;
            background-color: black;
            color: white;
            position: absolute;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 24px;
            font-size: 20px;
            top: 15px;
            right: 15px; 
        }
        .video{
            width: 320px;
            height: 180px;
            background-color: gray;
            position: fixed;
            bottom: 15px;
            right: 15px;
        }
    </style>
</head>
<body>
    <div class="close">X</div>
    <div class="video"></div>
</body>
</html>
