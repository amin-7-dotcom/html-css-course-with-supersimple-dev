<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>use of absolute</title>
    <style>
        body{
            height: 3000px;
        }
        .close{
            font-family: Arial;
            background-color: black;
            color: white;
            position:absolute;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 24px;
            font-size: 20px;
            top: -15px;
            left: -15px;


        }
        .video{
            width: 320px;
            height: 180px;
            background-color: gray;
            position: fixed;
            bottom: 15px;
            right: 15px;
        }
        .time{
            background-color: black;
            color: white;
            position: absolute;
            right: 15px;
            bottom: 15px;
            font-family: Arial;
            padding-left: 5px;
            padding-top: 5px;
            padding-right: 5px;
            padding-bottom: 5px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    
    <div class="video">
        <div class="close">X</div>
        <div class="time">0:29</div>
    </div>

</body>
</html>
